# Local PostgreSQL for the postgres sink. Integration tests do NOT use this; they start their own
# disposable container via Testcontainers.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: secstream
      POSTGRES_USER: secstream
      POSTGRES_PASSWORD: ${SECSTREAM_PG_PASSWORD:?set SECSTREAM_PG_PASSWORD (see .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secstream -d secstream"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
