# Local demo: read the sample files, print alerts to stdout, archive everything to a file.
# Run: java -jar target/secstream-0.1.0-SNAPSHOT-all.jar --config config/pipeline.yaml
pipeline:
  workers: 4
  queueCapacity: 10000
  maxPayloadBytes: 65536
  shutdownTimeout: 30s

processing:
  minSeverity: INFO
  dedupCapacity: 100000
  enrichers: [network-zone]

sources:
  - name: signin-file
    type: file
    path: samples/signin.jsonl
    format: signin
  - name: firewall-file
    type: file
    path: samples/firewall.jsonl
    format: firewall

sinks:
  - name: alerts
    type: console
  - name: archive
    type: file
    path: out/archive.jsonl
    delivery:
      queueCapacity: 10000
      batchSize: 500
      retry:
        maxAttempts: 5
        initialBackoff: 100ms
        maxBackoff: 5s
        multiplier: 2.0

routes:
  # Failed or high-severity events are alerts...
  - name: failed-signins
    minSeverity: MEDIUM
    categories: [AUTHENTICATION]
    outcomes: [FAILURE]
    sinks: [alerts]
  - name: blocked-admin-ports
    minSeverity: HIGH
    categories: [NETWORK]
    sinks: [alerts]
  # ...and everything is archived.
  - name: archive-all
    sinks: [archive]

deadLetter:
  path: out/dead-letter.jsonl

metrics:
  enabled: true
  host: 127.0.0.1
  port: 9090
  logInterval: 10s
